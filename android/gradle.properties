org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project (D:\...) and PUB_CACHE (C:\...) sit on different Windows drive
# letters, which makes Kotlin's incremental-compile cache throw
# "this and base files have different roots" when it tries to relativize
# paths across them. Incremental compilation is a build-speed optimization,
# not a correctness requirement, so it's simplest to just turn it off rather
# than force both paths onto the same drive.
kotlin.incremental=false
kotlin.incremental.js=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
